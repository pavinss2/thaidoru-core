name: Weekly X Avatar Refresh

# Checks every active (not graduated) member's X avatar URL. Dead or empty
# ones get looked up again, saved, and re-cached as WebP. Old WebPs are kept
# in assets/avatars/history/ so the site can swipe through them.
# Fully free: uses the public FxTwitter API, no X API key or secret needed.
on:
  schedule:
    - cron: '0 18 * * 0' # Every Monday 01:00 Bangkok time (Sunday 18:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report, do not change anything'
        type: boolean
        default: false
      only:
        description: 'Comma-separated member ids to check (blank = all active members)'
        type: string
        default: ''

permissions:
  contents: write # commit the updated members.json + webp files
  actions: write  # start the deploy workflow afterwards
  issues: write   # open an issue listing idols the bot couldn't fix

concurrency:
  group: x-avatar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Refresh X avatars
        env:
          NEEDS_ATTENTION_FILE: ${{ runner.temp }}/needs-attention.md
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ONLY: ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
        run: npm run refresh:avatars -- $DRY_RUN $ONLY

      - name: Validate data
        run: npm test

      - name: Commit and push changes
        id: commit
        run: |
          git add src/data/members.json assets/avatars
          if git diff --cached --quiet; then
            echo "No avatar changes this week."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh X avatars: $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Could not push after 5 tries" >&2
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deploy ourselves to publish the new avatars.
      - name: Deploy site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Idols the free lookup couldn't fix (usually a changed @handle) go into
      # one open issue, so you can update their handle by hand.
      - name: Report idols that need a manual fix
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ runner.temp }}/needs-attention.md
        run: |
          [ -f "$FILE" ] || { echo "Nothing needs a manual fix."; exit 0; }
          TITLE="X avatars need a manual check"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$FILE"
          else
            gh issue create --title "$TITLE" --body-file "$FILE"
          fi
